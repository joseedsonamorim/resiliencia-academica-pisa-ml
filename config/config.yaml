project_name: "PISA 2022 Creative Resilience (PISA 2022 Brasil)"
random_seed: 42

data:
  # detector de arquivo csv na pasta data/ (sem caminho fixo)
  dataset_glob_patterns:
    - "data/processed/PISA2022_BRASIL_FULL.csv"
    - "data/processed/PISA2022_BRASIL_ANALYSIS.csv"
  primary_dataset_min_rows: 100

paths:
  config_dir: "config"
  data_dir: "data"
  outputs_dir: "outputs"
  models_dir: "models"
  dashboard_dir: "dashboard"
  src_dir: "src"
  tests_dir: "tests"
  docs_dir: "docs"

outputs:
  figures_dir: "outputs/figures"
  tables_dir: "outputs/tables"
  reports_dir: "outputs/reports"

analysis:
  target_definitions:
    - A
    - B
    - C
    - D
  # Definição canônica de resiliência criativa usada no pipeline de modelagem.
  # A = ESCS ≤ Q1 e CRT ≥ Q3 (definição mais conservadora — baixo NSE + alto desempenho criativo)
  # B = ESCS ≤ P30 e CRT ≥ P70 (definição intermediária)
  # C = ESCS ≤ Q1 e CRT ≥ P90 (definição estrita — alto desempenho criativo no topo)
  # D = score composto (CRT_z - ESCS_z) ≥ P70 (definição exploratória de superação do contexto)
  # Justificativa da escolha de A: alinha-se com a literatura PISA (Q1/Q3) e maximiza precisão.
  target_profile_key: A
  leakage_severity_thresholds:
    critical_mutual_info_ratio: 5.0
    high_corr_abs: 0.95

clustering:
  analysis_mode: "full_population"  # full_population | vulnerable_only

  # grid search
  n_clusters_min: 2
  n_clusters_max: 10

  max_features: 80
  pca_variance_target: 0.85
  collinearity_threshold: 0.95

  # bootstrap stability
  bootstrap_iterations: 100
  bootstrap_sample_size: 300
  stability_top_n: 6

  algorithms:
    - agglomerative_ward
    - gmm
    - spectral
    - birch
    - hdbscan

  # Multicriteria score for the final choice (as specified in the refactor request)
  cluster_score_weights:
    silhouette: 0.30
    calinski_harabasz: 0.20
    davies_bouldin: -0.15
    stability: 0.35

  # interpretability / naming
  cluster_profile_top_above: 10
  cluster_profile_top_below: 10
  cluster_name_top_variables: 3

  feature_groups:

    accesso_tecnologico:
      - "ict"
      - "digital"
      - "computer"
      - "internet"
      - "device"
    uso_pedagogico_tic:
      - "icteach"
      - "pedag"
      - "icthome"
      - "ictsch"
    competencia_digital:
      - "ictcomp"
      - "skill"
      - "use"
    bem_estar_digital:
      - "sleep"
      - "screen"
      - "health"
      - "mood"
    recursos_domesticos:
      - "homepos"
      - "home"
      - "book"
      - "desk"
      - "quiet"
      - "study"
    apoio_familiar:
      - "parent"
      - "mother"
      - "father"
      - "family"
      - "support"
      - "encour"
    clima_escolar:
      - "school"
      - "teacher"
      - "class"
      - "bully"
      - "safety"
      - "discip"
    pertencimento:
      - "belong"
      - "included"
      - "accepted"
      - "satisf"
    motivacao:
      - "motiv"
      - "interest"
      - "effort"
      - "goal"
      - "persist"
    autoeficacia:
      - "self"
      - "effic"
      - "confid"
      - "capab"
    ansiedade:
      - "anx"
      - "worry"
      - "nerv"
      - "stress"
    indicadores_processuais:
      - "process"
      - "timing"
      - "time"
      - "attempt"
      - "engag"
    engajamento_tarefas_criativas:
      - "^CR590"
      - "CR590Q"

modeling:
  max_features: 80
  max_missing_ratio: 0.5
  test_size: 0.2
  cv_folds: 5
  cv_repeats: 3
  hyperparameter_search: true
  search_top_k: 3
  # Aumentado de 8 para 30: com espaços de busca de 4-6 hiperparâmetros,
  # 8 iterações explorava < 15% do espaço; 30 garante cobertura mais confiável.
  search_n_iter: 30
  n_bootstrap_holdout: 500

shap:
  max_rows: 800

robustness:
  n_bootstrap: 200

fairness:
  sensitive_feature_candidates:
    - Sexo
    - gender
    - ST004D01T
    - N_SEXO
    - Grupo_ESCS
    - school_type
    - HISCED
    - WISCED
    - region
    - UF
    - Região

weighted_analysis:
  sample_weight_candidates:
    - W_FSTUWT
